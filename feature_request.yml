name: Feature request
description: Suggest a new gameplay, engine, asset or modding feature.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it fit the project?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gameplay
        - World generation
        - Blocks and assets
        - Modding
        - Performance
        - Documentation
